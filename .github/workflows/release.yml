name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to recover (defaults to the current package version)
        required: false
        type: string

concurrency:
  group: david-skills-release
  cancel-in-progress: false

permissions:
  contents: write
  # Changesets reads associated PR metadata for changelog entries. It cannot create or edit PRs.
  pull-requests: read

jobs:
  release:
    name: Test, version, and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release directly
        run: bash scripts/direct-release.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_EVENT_SHA: ${{ github.sha }}
          RELEASE_RECOVERY_TAG: ${{ inputs.tag }}
